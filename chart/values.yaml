nameOverride: ""
fullnameOverride: ""

global:
  # -- Image pull secrets added to pod specs generated by this chart.
  imagePullSecrets:
    - registry-azure

  # -- Docker registry for KOBIL provided docker images
  registry: kobilsystems.azurecr.io

  # -- Limits for kubernetes object names
  limits:
    lengths:
      commonName: 63
      releaseName: 16
      fullname: 43

  annotations:
    # -- Custom annotations added to deployment metadata and pod spec
    common: {}

    # -- Custom annotations added to pod spec
    workload: {}

  labels:
    # -- Custom labels added to pod spec
    workloadPod: {}

  routing:
    # -- External domain name
    domain: local

    # -- Name of kubernetes TLS secret for the required domain and subdomains
    tlsSecret: tls-secret

    ingress:
      # -- Globally enable/disable creation of ingress resources.
      enabled: false

      # -- Ingress class name of the ingress controller.
      class: ~

    istio:
      # -- Globally enable/disable creation of istio ingress gateways
      # and virtual services. Requires istio operator.
      enabled: false

      # -- Enable/disable istio ingress gateways for the three API groups.
      # `public` gateway only routes endpoints marked as public.
      # `external` gateway routes endpoints marked as public and external.
      # `admin` gateway routes all endpoints.
      gateways:
        public: false
        external: false
        admin: false

      options:
        # -- Prefix for istio ingress gateway names. The final name is generated
        # by appending `-admin`, `-external`, `-public`, respectively.
        # Note, that istio ingress gateways names must be unique across the cluster.
        gatewayNamePrefix: istio-ingressgateway

        # -- Globally enable/disable injection of envoy sidecars.
        inject: false

  serviceMonitor:
    # -- Globally enable/disable creation of `monitoring.coreos.com/v1` serviceMonitor object.
    # Requires prometheus operator.
    enabled: false

  # -- Globally enable/disable creation of pod disruption budgets.
  podDisruptionBudget:
    enabled: false

# -- Value of label `app.kubernetes.io/part-of`
# added to resources generated by this chart. Defaults to the app slug
# but a group of related charts (an app plus its companion DB / worker
# / migration charts) can share a single partof label so the K8s
# `app.kubernetes.io/part-of` selector groups them together.
partof: profile-app

# -- Value of label `app.kubernetes.io/component`
# added to resources generated by this chart.
component: webapp

# -- Number of desired pods for this deployment.
replicaCount: 1

# -- OIDC configuration. The discovery URL, client ID, and redirect
# URI are public; only `clientSecret` is sensitive and lands in the
# chart's `envFromSecret` block. Env-var names follow the OIDC RFC
# (vendor-neutral) so any IDP - KOBIL Identity in deployed
# environments, Keycloak / Auth0 / Okta elsewhere - drops in without
# code changes. Per-environment Helm overlays set the real values.
oidc:
  discoveryUrl: ""
  clientId: ""
  clientSecret: ""
  redirectUri: ""

# -- App-specific config not covered by the OIDC/DB blocks. Required for the
# profile-app to boot.
app:
  # -- APP_BASE_URL — fully-qualified public URL, no trailing slash. Used by
  # every OIDC redirect-URI builder; must match the istio host + scheme.
  baseUrl: ""

auth:
  # -- AUTH_SECRET — jose HS256 key signing the session cookie. Min 32 chars.
  # Generate with: openssl rand -base64 48
  secret: ""

# -- Postgres connection pieces. Split into discrete fields so the
# secret-bearing piece (`password`) lands in a Kubernetes Secret while
# the rest stays in a ConfigMap. The pod env follows libpq's standard
# variable names (`PGHOST`, `PGUSER`, ...) so `psql` / `pg_dump` /
# `pg_isready` inside the same container Just Work without glue;
# `docker-entrypoint.sh` composes the `DATABASE_URL` Prisma needs from
# them, plus a `PGOPTIONS=-c search_path=<schema>` so libpq tools
# honour the schema preference too.
database:
  host: ""
  port: 5432
  user: ""
  password: ""
  name: ""
  schema: "public"

mainContainer:
  # -- Image repository, tag, and pull policy. Tag is automatically
  # set to `Chart.appVersion` when using the default value `''`.
  image:
    repository: ai-mini-apps/profile-app
    tag: ""
    pullPolicy: IfNotPresent

  # -- Entrypoint command and args
  # (https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#entrypoint).
  entrypoint:
    command: []
    args: []

  # -- Readiness probe
  # (https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#entrypoint).
  readinessProbe:
    httpGet:
      path: /api/health
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 3

  # -- Liveness probe
  # (https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#entrypoint).
  livenessProbe:
    tcpSocket:
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 3

  # -- Startup probe
  # (https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#entrypoint).
  # 60 * 3s = ~180s window absorbs the first-start `prisma db push` wait.
  startupProbe:
    httpGet:
      path: /api/health
      port: http
    initialDelaySeconds: 0
    periodSeconds: 3
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 60

  # -- Resource requests and limits
  # (https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#resources).
  resources:
    limits:
      memory: 384Mi
    requests:
      cpu: 100m
      memory: 384Mi

  # -- Environment variables to be mapped via configmap.
  # Defined as `key: value` pairs.
  envFromConfigmap:
    OIDC_DISCOVERY_URL: "{{ .Values.oidc.discoveryUrl }}"
    OIDC_CLIENT_ID: "{{ .Values.oidc.clientId }}"
    OIDC_REDIRECT_URI: "{{ .Values.oidc.redirectUri }}"
    APP_BASE_URL: "{{ .Values.app.baseUrl }}"
    PGHOST: "{{ .Values.database.host }}"
    PGPORT: "{{ .Values.database.port }}"
    PGUSER: "{{ .Values.database.user }}"
    PGDATABASE: "{{ .Values.database.name }}"
    PGSCHEMA: "{{ .Values.database.schema }}"

  # -- Environment variables to be mapped via secret.
  # Defined as `key: value` pairs.
  envFromSecret:
    OIDC_CLIENT_SECRET: "{{ .Values.oidc.clientSecret }}"
    AUTH_SECRET: "{{ .Values.auth.secret }}"
    PGPASSWORD: "{{ .Values.database.password }}"

  # -- SecurityContext defining the security options the container should be run with
  # (https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#security-context-1).
  securityContext: {}

  # -- Ports to expose from the main container and via the kubernetes service.
  # The default exposes port 8080 from the container (`target`)
  # via port 80 in the service (`service`) and names the port `http`.
  # Multiple ports can be defined.
  # Istio port naming conventions should be applied
  # (https://istio.io/latest/docs/ops/configuration/traffic-management/protocol-selection/).
  ports:
    http:
      target: 3000
      service: 80

sidecars:
  tailLog: {}

routing:
  # -- External subdomain. Defaults to the app slug; override when the
  # public host segment differs from the project / chart slug.
  subdomain: profile-app

  istio:
    # -- Enable/disable creation and virtual services.
    # Requires `global.routing.istio.enabled: true`.
    enabled: true

    options:
      # -- Enable/disable injection of envoy sidecars.
      # Requires `global.routing.istio.options.inject: true`.
      inject: true

    # -- Definition of the hosts and paths to be added to istio virtual service.
    # Tiers are additive in ks-chart-template-common: admin inherits public, so
    # the admin gateway reaches every prefix automatically. Each route is mapped
    # to the LEAST-privileged gateway that needs it — no `prefix: /` catch-all
    # (which would attach /admin + /api/admin to the internet-facing public
    # gateway). Root is an `exact` match so it routes only the menu landing.
    # /api/health + /api/metrics have no entry: kubelet and the ServiceMonitor
    # reach the pod via the k8s Service, bypassing Istio.
    hosts:
      - host: "{{ .Values.routing.subdomain }}.{{ .Values.global.routing.domain }}"
        paths:
          # public gateway (internet): the menu landing + profile UI + its API
          public:
            - exact: /
            - prefix: /profile
            - prefix: /access-denied
            - prefix: /_next
            - prefix: /favicon.ico
            - prefix: /api/auth
            - prefix: /api/me
          # admin gateway (internal network only): admin UI + admin API
          admin:
            - prefix: /admin
            - prefix: /api/admin

  ingress:
    # -- Enable/disable creation and ingress resource.
    # Requires `global.routing.ingress.enabled: true`.
    enabled: false

    # -- Optional annotations to add to the ingress resource
    annotations: {}

    # A plain Ingress has no public/admin tier concept (single entry point), so
    # mirror the security intent by routing only the non-admin paths. /admin +
    # /api/admin are intentionally absent so they never get an internet route.
    hosts:
      - host: "{{ .Values.routing.subdomain }}.{{ .Values.global.routing.domain }}"
        paths:
          - path: /profile
            pathType: Prefix
          - path: /access-denied
            pathType: Prefix
          - path: /_next
            pathType: Prefix
          - path: /favicon.ico
            pathType: Prefix
          - path: /api/auth
            pathType: Prefix
          - path: /api/me
            pathType: Prefix

# -- Declaration of the horizontal pod autoscaler
# (https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/).
# Set `enabled: true` to enable and define `minReplicas` and `maxReplicas` accordingly.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: ~
  targetMemoryUtilizationPercentage: ~
  behavior: {}

service:
  # -- Type of the kubernetes service resource.
  type: ClusterIP
  # -- Custom annotations added to service
  annotations: {}

pod:
  # -- Service account used for the pod. The service account is created automatically
  # when `create: true`. Optional annotations can be set via value `annotations`.
  serviceAccount:
    create: true
    annotations: {}
    name: ""
    createRbac: true

  # -- Pod security context
  # (https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#security-context).
  securityContext: {}

  # -- Parameters to define pod scheduling.
  scheduling:
    nodeSelector: {}
    tolerations: []
    affinity: {}

  # -- Configuration of pod disruption budget.
  disruptionBudget:
    enabled: true
    annotations: {}
    minAvailable: 1
    maxUnavailable: ""

# -- Specification of the serviceMonitor object.
# Requires `global.serviceMonitor.enabled: true`. Prometheus metrics endpoint is
# configured using `endpoint.port` and `endpoint.path`.
serviceMonitor:
  endpoint:
    port: http
    path: /api/metrics

tests:
  # -- Basic helm test sending an http GET request to the defined endpoint.
  connection:
    protocol: "http"
    path: "/api/health"
    image:
      repository: it-solutions/shell-tools-micro
      tag: "3.1.9"
      pullPolicy: IfNotPresent
